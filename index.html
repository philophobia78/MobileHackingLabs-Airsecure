<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AirSecure - Digital Boarding Pass</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 90%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: white;
            padding: 20px 24px;
        }
        .header h1 { font-size: 18px; font-weight: 600; }
        .header p { font-size: 12px; opacity: 0.8; margin-top: 4px; }
        .body { padding: 24px; }
        .field { margin-bottom: 16px; }
        .field label {
            font-size: 11px;
            text-transform: uppercase;
            color: #888;
            letter-spacing: 0.5px;
        }
        .field .value {
            font-size: 16px;
            font-weight: 600;
            color: #222;
            margin-top: 2px;
        }
        .row { display: flex; gap: 16px; }
        .row .field { flex: 1; }
        .status {
            text-align: center;
            padding: 16px 24px 24px;
            font-size: 13px;
            color: #666;
        }
        .status.success { color: #2e7d32; }
        .status.error { color: #c62828; }
    </style>
    <script>
        window.onload = function() {
            try {
                // Generate the boarding pass with _qr value
                //var generateStr = window._metrics.generateBoardingPass("Jane Doe", "14A", 14, "BP1337", "847-2993187054" );
          
                // Get the Boarding pass
                var infoStr = window.BoardingPass.getPassengerInfo();
                if (infoStr && infoStr.length > 0) {
                    var info = JSON.parse(infoStr);
                    document.getElementById('f-name').textContent = info.name || 'N/A';
                    document.getElementById('f-flight').textContent = info.flight || '--';
                    document.getElementById('f-seat').textContent = info.seat || '--';
                    document.getElementById('f-row').textContent = info.row || '--';
                    document.getElementById('f-eticket').textContent = info.eticket || '--';
                    document.getElementById('f-flag').textContent =  info._qr || '--';
                    document.getElementById('status').className = 'status success';
                    document.getElementById('status').textContent = 'Boarding Pass ready.';
                } else {
                     throw new Error('No passenger data found.');
                }
            } catch (e) {
                document.getElementById('f-name').textContent = 'Error';
                document.getElementById('status').className = 'status error';
                document.getElementById('status').textContent = 'Error: Could not load boarding pass data. ' + (e.message || '');
            }
        };
    </script>
</head>
<body>
    <div class="card">
        <div class="header">
            <h1>AirSecure Digital Pass</h1>
            <p>Your Boarding Pass</p>
        </div>
        <div class="body">
            <div class="field">
                <label>Passenger</label>
                <div class="value" id="f-name">Loading...</div>
            </div>
            <div class="row">
                <div class="field">
                    <label>Flight</label>
                    <div class="value" id="f-flight">--</div>
                </div>
                <div class="field">
                    <label>Seat</label>
                    <div class="value" id="f-seat">--</div>
                </div>
                <div class="field">
                    <label>Row</label>
                    <div class="value" id="f-row">--</div>
                </div>
                <div class="field">
                    <label>Flag</label>
                    <div class="value" id="f-flag">--</div>
                </div>
            </div>
            <div class="field">
                <label>E-Ticket</label>
                <div class="value" id="f-eticket">--</div>
            </div>
        </div>
        <div class="status" id="status">
            Loading boarding pass...
        </div>
    </div>
</body>
</html>
